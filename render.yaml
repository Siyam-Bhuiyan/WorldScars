# Render Blueprint: backend only (frontend is on Netlify, database on Neon).
services:
  - type: web
    name: worldscars-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx320m -XX:+UseSerialGC
      - key: DATABASE_URL        # Neon connection string
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: FRONTEND_URL        # your Netlify URL
        sync: false
