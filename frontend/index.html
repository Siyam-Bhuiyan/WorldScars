<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/scar.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070706" />
    <meta name="description" content="WorldScars: pictures the world watched for a moment and forgot, each kept with what happened." />
    <title>WorldScars — The World Watched</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify detects this at deploy time; the React form posts to it (see AccessRequest.tsx). -->
    <form name="access-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="email" />
      <input name="name" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
