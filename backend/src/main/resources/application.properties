spring.application.name=worldscars-backend
server.port=${PORT:8080}

# --- Database (JDBC URL, e.g. jdbc:postgresql://host:5432/worldscars) ---
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Cloudinary: set these in the environment, never in code ---
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# --- Write protection: uploads/deletes need header X-Admin-Token == ADMIN_TOKEN ---
app.admin-token=${ADMIN_TOKEN:}

# --- CORS: FRONTEND_URL may be a comma-separated list; known origins are always allowed ---
app.cors.allowed-origins=${FRONTEND_URL:},http://localhost:5173,http://localhost:3000,https://worldscars-production.up.railway.app

# --- Uploads ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# --- Connection pool: serverless Postgres (Neon) drops idle connections, so recycle early ---
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
